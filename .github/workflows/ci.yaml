name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'README.md.tmpl'
      - '.github/**'
      - 'examples/**'
      - 'Makefile'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'README.md.tmpl'
      - '.github/**'
      - 'examples/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  lint:
    name: Run linting checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
            fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'

      - name: Run go vet
        run: make vet

      - name: Run linting
        run: make lint

      - name: Run tests
        run: make test